name: tournament_master_offline
description: Tournament Master Offline - runs only on the device with SQLite, no server needed.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.41.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  uuid: ^4.4.0
  intl: ^0.19.0
  sqflite: ^2.3.3+1
  sqflite_common_ffi_web: ^0.4.5
  path: ^1.9.0
  path_provider: ^2.1.4
  url_launcher: ^6.3.1
  crypto: ^3.0.3
  http: ^1.2.2
  excel: ^4.0.6
  printing: ^5.13.1
  pdf: ^3.11.1
  file_picker: ^8.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
